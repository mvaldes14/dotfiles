onboarding = false
# herdr config — keymaps ported from tmux. Apply edits with: herdr server reload-config

[keys]
prefix = "ctrl+space"

split_vertical = "prefix+v"
split_horizontal = "prefix+h"
close_pane = "prefix+w"

focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"
resize_mode = "prefix+shift+r"

new_tab = "prefix+t"
next_tab = "prefix+tab"
cycle_pane_next = ""
last_pane = "prefix+l"

new_workspace = "prefix+n"
workspace_picker = "prefix+o"
goto = "prefix+s"
navigate_workspace_up = "j"
navigate_workspace_down = "k"

reload_config = "prefix+r"
detach = "prefix+d"
rename_tab = "prefix+,"

[[keys.command]]
key = "prefix+f"
type = "pane"
command = "~/.local/bin/herdr-sessionizer.sh"

[theme]
name = "terminal"
auto_switch = false

[theme.custom]
surface0 = "#005d5d"

[ui]
show_agent_labels_on_pane_borders = true
sidebar_width = 20
sidebar_collapsed_mode = "hidden"
prompt_new_tab_name = false
pane_gaps = false
accent = "red"
agent_panel_sort = "priority"

[ui.toast]
delivery = "terminal"

[ui.sidebar.agents]
row_gap = 1
rows = [["state_icon", "workspace"], ["agent"]]
