onboarding = false
# herdr config — keymaps ported from tmux. Apply edits with: herdr server reload-config

[keys]
close_pane = "prefix+w"
detach = "prefix+ctrl+d"
focus_agent = "prefix+ctrl+1..9"
goto = "prefix+s"
last_pane = "prefix+l"
navigate_workspace_down = "j"
navigate_workspace_up = "k"
new_tab = "prefix+t"
new_workspace = "prefix+n"
next_agent = "prefix+ctrl+n"
next_tab = "prefix+tab"
open_notification_target = "prefix+g"
prefix = "ctrl+space"
previous_agent = "prefix+ctrl+p"
reload_config = "prefix+r"
rename_tab = "prefix+,"
resize_mode = "prefix+shift+r"
settings = "prefix+shift+s"
split_horizontal = "prefix+h"
split_vertical = "prefix+v"
switch_workspace = "prefix+shift+1..9"
workspace_picker = "prefix+o"

[[keys.command]]
key = "prefix+f"
type = "pane"
command = "~/.local/bin/herdr-sessionizer.sh"

# Swap panes (tmux: prefix+{ = swap-pane -U, prefix+} = swap-pane -D)
[[keys.command]]
key = "prefix+{"
type = "shell"
command = "~/.local/bin/herdr-pane-swap.sh prev"
description = "Swap pane with previous"

[[keys.command]]
key = "prefix+}"
type = "shell"
command = "~/.local/bin/herdr-pane-swap.sh next"
description = "Swap pane with next"

# Toggle split orientation (tmux: prefix+space, select-layout next)
[[keys.command]]
key = "prefix+space"
type = "shell"
command = "~/.local/bin/herdr-layout-toggle.sh"
description = "Toggle layout horizontal/vertical"

# [[keys.command]]
# key = "prefix+shift+f"
# type = "plugin_action"
# command = "fullerzz.sesh.open-picker"
# description = "Sesh picker"

[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "usagebar.open-limits"
description = "Agent Usage: open limits pane"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "usagebar.refresh"
description = "Agent Usage: refresh sidebar meters"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[[keys.command]]
key = "prefix+shift+f"
type = "shell"
command = "herdr-theme-sync"
description = "sync herdr theme from ghostty"

[theme.custom]
panel_bg = "reset"
accent = "#178ec8"
text = "#9cc2c3"
subtext0 = "#7a8f8e"
surface0 = "#08262f"
surface1 = "#0e2d35"
surface_dim = "#05232c"
overlay0 = "#37575e"
overlay1 = "#56787d"
mauve = "#e24d8e"
green = "#51ef84"
yellow = "#b27e28"
red = "#f5163b"
blue = "#178ec8"
teal = "#00b39e"
peach = "#f34b00"


[ui]
show_agent_labels_on_pane_borders = true
sidebar_width = 26
sidebar_collapsed_mode = "hidden"
prompt_new_tab_name = false
pane_gaps = false
agent_panel_sort = "priority"
hide_tab_bar_when_single_tab =  false
status_indicators = "symbols"
tab_bar_right = [
  { type = "hostname" },
  { type = "datetime", format = "%H:%M" },
  { type = "text", text = "prod" },
]
tab_bar_position = "top"
tab_bar_right_separator = " · "
window_title = "{hostname}: {workspace} {tab} {pane}"

[ui.toast]
delivery = "terminal"

[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "$title", "workspace"],
  ["agent"],
  ["$limit"],
  ["$context"],
]

